apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana
spec:
  interval: 5m0s
  url: https://grafana-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
spec:
  interval: 10m
  timeout: 5m
  chart:
    spec:
      chart: grafana
      version: '14.2.0'
      sourceRef:
        kind: HelmRepository
        name: grafana
  values:
    serviceMonitor:
      enabled: true
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
        - name: Prometheus
          type: prometheus
          url: http://prometheus.monitoring.svc.cluster.local:9090
          editable: false
        - name: loki
          type: loki
          url: http://logging-loki-gateway.logging.svc.cluster.local
          editable: false
    # Provision grafana-dashboards-kubernetes
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
        - name: 'grafana-dashboards-kubernetes'
          orgId: 1
          folder: 'Kubernetes'
          type: file
          disableDeletion: true
          editable: true
          options:
            path: /var/lib/grafana/dashboards/grafana-dashboards-kubernetes
        - name: 'grafana-dashboards-windows'
          orgId: 1
          folder: 'Windows'
          type: file
          disableDeletion: true
          editable: true
          options:
            path: /var/lib/grafana/dashboards/windows
        - name: 'grafana-dashboards-pi'
          orgId: 1
          folder: 'Raspberry Pis'
          type: file
          disableDeletion: true
          editable: true
          options:
            path: /var/lib/grafana/dashboards/pi
        - name: 'grafana-dashboards-crowdsec'
          orgId: 1
          folder: 'CrowdSec'
          type: file
          disableDeletion: true
          editable: true
          options:
            path: /var/lib/grafana/dashboards/crowdsec
    dashboards:
      grafana-dashboards-crowdsec:
        crowdsec-overview:
          url: https://raw.githubusercontent.com/bl-robinson/home-flux/master/clusters/home/monitoring/dashboards/crowdsec-overview.json
          datasource:
          - name: DS_PROMETHEUS
            value: Prometheus
        crowdsec-insight:
          url: https://raw.githubusercontent.com/bl-robinson/home-flux/master/clusters/home/monitoring/dashboards/crowdsec-insight.json
          datasource:
          - name: DS_PROMETHEUS
            value: Prometheus
        crowdsec-details-per-machine:
          url: https://raw.githubusercontent.com/bl-robinson/home-flux/master/clusters/home/monitoring/dashboards/crowdsec-details-per-machine.json
          datasource:
          - name: DS_PROMETHEUS
            value: Prometheus
        crowdsec-lapi-metrics:
          url: https://raw.githubusercontent.com/bl-robinson/home-flux/master/clusters/home/monitoring/dashboards/crowdsec-lapi-metrics.json
          datasource:
          - name: DS_PROMETHEUS
            value: Prometheus
      # data/backup Pis: Alloy node metrics (job=pi-nodes) + smartctl_exporter (job=smartctl)
      grafana-dashboards-pi:
        node-exporter-full:
          # Has its own datasource picker variable, so no substitution needed.
          gnetId: 1860
          revision: 46
        zfs-overview:
          gnetId: 24987
          revision: 12
          datasource:
          - name: DS_PROMETHEUS
            value: Prometheus
        smartctl-exporter:
          gnetId: 22604
          revision: 4
          datasource:
          - name: DS_PROMETHEUS
            value: Prometheus
      grafana-dashboards-kubernetes:
        k8s-system-api-server:
          url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-system-api-server.json
          token: ''
        k8s-system-coredns:
          url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-system-coredns.json
          token: ''
        k8s-views-global:
          url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-global.json
          token: ''
        k8s-views-namespaces:
          url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-namespaces.json
          token: ''
        k8s-views-nodes:
          url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-nodes.json
          token: ''
        k8s-views-pods:
          url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-pods.json
          token: ''
      grafana-dashboards-windows:
        windows-exporter:
          url: https://raw.githubusercontent.com/bl-robinson/home-flux/master/clusters/home/monitoring/dashboards/windows-exporter.json
          token: ''
        nvidia_gpu_metrics:
          url: https://raw.githubusercontent.com/utkuozdemir/nvidia_gpu_exporter/main/charts/nvidia-gpu-exporter/dashboards/nvidia-gpu-metrics.json
          token: ''
        nvidia_gpu_overview:
          url: https://raw.githubusercontent.com/utkuozdemir/nvidia_gpu_exporter/main/docs/grafana/dashboard-overview.json
          token: ''
  releaseName: grafana
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: grafana
spec:
  hostnames:
  - grafana.k8s.home.blrobinson.uk
  parentRefs:
  - name: gateway-ingress
    namespace: ingress
  rules:
  - backendRefs:
    - name: grafana
      port: 80
