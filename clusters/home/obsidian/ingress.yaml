apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: obsidian-sync-public
spec:
  hostnames:
  - obsidian-sync.blrobinson.uk
  parentRefs:
  - name: nginx-ingress
    namespace: ingress
    sectionName: https
  rules:
  - filters:
    # Pin the real client IP: overwrite whatever the client sent (Envoy expands the %...% variable).
    # CF-Connecting-IP / True-Client-IP are removed because AdGuard trusts them ahead of X-Real-IP.
    - type: RequestHeaderModifier
      requestHeaderModifier:
        set:
        - name: X-Forwarded-For
          value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
        - name: X-Real-IP
          value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
        - name: X-Client-IP
          value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
        remove:
        - CF-Connecting-IP
        - True-Client-IP
    backendRefs:
    - name: obsidian-svc-couchdb
      port: 5984
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: obsidian-web-public
spec:
  hostnames:
  - obsidian.blrobinson.uk
