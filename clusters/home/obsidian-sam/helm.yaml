apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: couchdb
spec:
  interval: 5m0s
  url: https://apache.github.io/couchdb-helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: couchdb
spec:
  interval: 10m
  timeout: 5m
  chart:
    spec:
      chart: couchdb
      version: '4.6.3'
      sourceRef:
        kind: HelmRepository
        name: couchdb
  values:
    fullnameOverride: obsidian   # -> StatefulSet obsidian-couchdb, Service obsidian-svc-couchdb
    clusterSize: 1

    # Credentials are bootstrapped by Terraform (terraform-k8s-cluster-bootstrap/obsidian.tf)
    createAdminSecret: false
    extraSecretName: couchdb-admin
    adminUsernameKey: adminUsername
    adminPasswordKey: adminPassword
    cookieAuthSecretKey: cookieAuthSecret
    erlangCookieKey: erlangCookie

    persistentVolume:
      enabled: true
      size: 5Gi
      accessModes:
        - ReadWriteOnce

    # Cilium gateway traffic is not matched by the chart's NetworkPolicy
    networkPolicy:
      enabled: false

    initImage:
      repository: busybox
      tag: "1.37.0"
      pullPolicy: IfNotPresent

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

    # Settings required by Obsidian Self-hosted LiveSync
    # https://github.com/vrtmrz/obsidian-livesync/blob/main/docs/setup_own_server.md
    couchdbConfig:
      couchdb:
        uuid: 84593e452ab641efb2093f315838fce5   # must stay stable for the life of the data
        single_node: true
        max_document_size: 50000000
      chttpd:
        bind_address: any
        require_valid_user: true
        max_http_request_size: 4294967296
        enable_cors: true
      chttpd_auth:
        require_valid_user: true
        authentication_redirect: /_utils/session.html
      httpd:
        WWW-Authenticate: Basic realm="couchdb"
        enable_cors: true
      cors:
        origins: app://obsidian.md,capacitor://localhost,http://localhost
        credentials: true
        headers: accept, authorization, content-type, origin, referer
        methods: GET, PUT, POST, HEAD, DELETE
        max_age: 3600
  releaseName: couchdb
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
