apiVersion: logging.banzaicloud.io/v1beta1
kind: Logging
metadata:
  name: logging
spec:
  controlNamespace: logging
  fluentd:
    disablePvc: true
    resources:
      limits:
        memory: 1Gi
      requests:
        cpu: 200m
        memory: 1Gi
---
apiVersion: logging.banzaicloud.io/v1beta1
kind: FluentbitAgent
metadata:
  name: logging-agent
---
apiVersion: logging.banzaicloud.io/v1beta1
kind: ClusterFlow
metadata:
  name: clusterflow
spec:
  globalOutputRefs:
    - loki-output
  filters:
    - tag_normaliser: {}
  match:
    - select: {}
---
apiVersion: logging.banzaicloud.io/v1beta1
kind: ClusterOutput
metadata:
  name: loki-output
spec:
  loki:
    configure_kubernetes_labels: true
    url: http://logging-loki-gateway.logging.svc.cluster.local
    buffer:
      timekey: 1m
      timekey_wait: 30s
      timekey_use_utc: true
      # File buffer defaults to 256MB chunks, which OOM fluentd when a backlog flushes
      chunk_limit_size: 8MB
      total_limit_size: 2GB
      overflow_action: drop_oldest_chunk
      # timekey 1m makes ~20 small chunks/min; a single flush thread only
      # pushes about that many, so any backlog after a Loki outage never
      # drains. Parallel flushes let it catch up.
      flush_thread_count: 8
