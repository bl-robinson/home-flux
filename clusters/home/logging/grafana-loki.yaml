apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana
  namespace: logging
spec:
  interval: 5m0s
  # loki chart 20.x (Loki 3.7.x) is only published in the grafana-community
  # helm-charts repo; Flux will now pull loki from this repo instead.
  url: https://grafana-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: logging-loki
  namespace: logging
spec:
  interval: 10m
  timeout: 5m
  chart:
    spec:
      chart: loki
      version: '20.0.2'
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: logging
  values:
    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      storage:
        type: filesystem
      # chart 20.x requires a schema_config. The store was wiped on
      # 2026-10-29 and started fresh on tsdb/v13 only; the old boltdb-shipper
      # period was dropped (it shared the loki_index_ prefix, so on the
      # switchover day both stores wrote into the same daily table and tsdb
      # failed to load it). Add a new period with a future `from` date if
      # the schema ever changes again; never edit this one in place.
      schemaConfig:
        configs:
          - from: "2026-10-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            # required: Loki 3.x rejects a tsdb period without a periodic
            # index config (startup: "tsdb must always have periodic config
            # for index set to 24h")
            index:
              prefix: loki_index_
              period: 24h
      rulerConfig:
        storage:
          type: local
      limits_config:
        # allow_structured_metadata is left at the Loki 3.x default (true),
        # which requires a tsdb/v13 schema - satisfied by the only period.
        max_cache_freshness_per_query: 15m
        ingestion_rate_mb: 5
        # fluentd's loki plugin sends service/pod/container/host/pod_id/
        # container_id plus every kubernetes label, so heavily-labelled pods
        # (19+ names, e.g. the gha runners) exceed Loki's default limit of
        # 15 and are rejected with 400 on push; raise it so all streams land.
        # Loki 3.x renamed this key: per-limit is now
        # `max_label_names_per_series` (the older `max_label_names` no longer
        # parses in 3.7.x - setting it makes Loki exit 1 on config load).
        max_label_names_per_series: 32
      querier:
        tail_max_duration: 24h
      # Full memberlist section (setting memberlistConfig replaces the
      # chart's embedded one, so join_members is repeated explicitly).
      # chart 20.x defaults abort_if_cluster_join_fails: true, and the
      # seed service only resolves DNS once the pod is ready, while /ready
      # needs the ring to settle first - a chicken-and-egg that made every
      # bounce crashloop and Flux abort + auto-roll-back the upgrade (all
      # remediation attempts consumed). With a single replica a join
      # failure must be tolerated, not fatal.
      memberlistConfig:
        abort_if_cluster_join_fails: false
        advertise_port: 7946
        bind_port: 7946
        join_members:
          - logging-loki-memberlist.logging.svc.cluster.local
        max_join_backoff: 1m
        max_join_retries: 10
        min_join_backoff: 1s
        rejoin_interval: 90s
    memberlist:
      service:
        # keep the seed service resolvable while the pod is not ready;
        # otherwise the join above has no address to look up (NXDOMAIN or
        # a stale endpoint) and readiness can never settle
        publishNotReadyAddresses: true
    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        selector:
          matchLabels:
            volume: loki
        size: 5Gi
    # chart 20.x ships these enabled by default; the 5.10.0 release was
    # configured without them, so they are disabled to keep the current
    # workload footprint (enable individually if wanted)
    sidecar:
      rules:
        enabled: false
    lokiCanary:
      enabled: false
    # chart 20.x requires the Loki canary when Helm tests run
    test:
      enabled: false
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    # chart 20.x defaults these to 3; zeroed so singleBinary + filesystem
    # storage passes the chart's deploymentMode validation
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
