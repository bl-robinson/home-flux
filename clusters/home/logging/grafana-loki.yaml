apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana
  namespace: logging
spec:
  interval: 5m0s
  # loki chart 20.x (Loki 3.7.x) is only published in the grafana-community
  # helm-charts repo; Flux will now pull loki from this repo instead.
  url: https://grafana-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: logging-loki
  namespace: logging
spec:
  interval: 10m
  timeout: 5m
  chart:
    spec:
      chart: loki
      version: '20.0.2'
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: logging
  values:
    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      storage:
        type: filesystem
      # chart 20.x requires a schema_config; this is what 5.10.0 rendered by
      # default, so existing boltdb-shipper indexes keep resolving
      schemaConfig:
        configs:
          - from: "2022-01-11"
            store: boltdb-shipper
            object_store: filesystem
            schema: v12
            index:
              prefix: loki_index_
              period: 24h
      rulerConfig:
        storage:
          type: local
      limits_config:
        # Loki 3.x enables structured metadata by default, which rejects a
        # schema below v13 that doesn't use a tsdb index; we are still on the
        # v12/boltdb-shipper schema until that index is migrated.
        allow_structured_metadata: false
        max_cache_freshness_per_query: 15m
        ingestion_rate_mb: 5
      querier:
        tail_max_duration: 24h
    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        selector:
          matchLabels:
            volume: loki
        size: 5Gi
    # chart 20.x ships these enabled by default; the 5.10.0 release was
    # configured without them, so they are disabled to keep the current
    # workload footprint (enable individually if wanted)
    sidecar:
      rules:
        enabled: false
    lokiCanary:
      enabled: false
    # chart 20.x requires the Loki canary when Helm tests run
    test:
      enabled: false
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    # chart 20.x defaults these to 3; zeroed so singleBinary + filesystem
    # storage passes the chart's deploymentMode validation
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
