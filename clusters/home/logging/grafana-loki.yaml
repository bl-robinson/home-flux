apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana
  namespace: logging
spec:
  interval: 5m0s
  # loki chart 20.x (Loki 3.7.x) is only published in the grafana-community
  # helm-charts repo; Flux will now pull loki from this repo instead.
  url: https://grafana-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: logging-loki
  namespace: logging
spec:
  interval: 10m
  timeout: 5m
  chart:
    spec:
      chart: loki
      version: '20.0.2'
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: logging
  values:
    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      storage:
        type: filesystem
      # chart 20.x requires a schema_config. The first period covers all data
      # written before 2026-10-29 and stays in place so old boltdb-shipper
      # indexes keep resolving. From 2026-10-29 (00:00 UTC, already past)
      # new data is indexed in tsdb, which makes the tsdb/v13 period the
      # active one immediately. Accepted trade-off (homelab, discussed):
      # any logs written between 2026-10-29 00:00 UTC and this upgrade were
      # indexed under the old period and stop resolving once this applies.
      schemaConfig:
        configs:
          - from: "2022-01-11"
            store: boltdb-shipper
            object_store: filesystem
            schema: v12
            index:
              prefix: loki_index_
              period: 24h
          - from: "2026-10-29"
            store: tsdb
            object_store: filesystem
            schema: v13
            # required: Loki 3.x rejects a tsdb period without a periodic
            # index config (startup: "tsdb must always have periodic config
            # for index set to 24h")
            index:
              prefix: loki_index_
              period: 24h
      rulerConfig:
        storage:
          type: local
      limits_config:
        # allow_structured_metadata is intentionally not set (Loki 3.x
        # defaults to true): the active schema period is now tsdb/v13, so
        # Loki's startup validation accepts it. The temporary `false`
        # override added for the 2.8 → 3.7 upgrade is no longer needed.
        max_cache_freshness_per_query: 15m
        ingestion_rate_mb: 5
        # fluentd's loki plugin sends service/pod/container/host/pod_id/
        # container_id plus every kubernetes label, so heavily-labelled pods
        # (19+ names, e.g. the gha runners) exceed Loki's default limit of
        # 15 and are rejected with 400 on push; raise it so all streams land.
        max_label_names: 32
      querier:
        tail_max_duration: 24h
      # Full memberlist section (setting memberlistConfig replaces the
      # chart's embedded one, so join_members is repeated explicitly).
      # chart 20.x defaults abort_if_cluster_join_fails: true, and the
      # seed service only resolves DNS once the pod is ready, while /ready
      # needs the ring to settle first - a chicken-and-egg that made every
      # bounce crashloop and Flux abort + auto-roll-back the upgrade (all
      # remediation attempts consumed). With a single replica a join
      # failure must be tolerated, not fatal.
      memberlistConfig:
        abort_if_cluster_join_fails: false
        advertise_port: 7946
        bind_port: 7946
        join_members:
          - logging-loki-memberlist.logging.svc.cluster.local
        max_join_backoff: 1m
        max_join_retries: 10
        min_join_backoff: 1s
        rejoin_interval: 90s
    memberlist:
      service:
        # keep the seed service resolvable while the pod is not ready;
        # otherwise the join above has no address to look up (NXDOMAIN or
        # a stale endpoint) and readiness can never settle
        publishNotReadyAddresses: true
    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        selector:
          matchLabels:
            volume: loki
        size: 5Gi
    # chart 20.x ships these enabled by default; the 5.10.0 release was
    # configured without them, so they are disabled to keep the current
    # workload footprint (enable individually if wanted)
    sidecar:
      rules:
        enabled: false
    lokiCanary:
      enabled: false
    # chart 20.x requires the Loki canary when Helm tests run
    test:
      enabled: false
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    # chart 20.x defaults these to 3; zeroed so singleBinary + filesystem
    # storage passes the chart's deploymentMode validation
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
