apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: open-webui
  namespace: llm-tools
spec:
  interval: 5m0s
  url: https://helm.openwebui.com/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
  namespace: llm-tools
spec:
  interval: 10m
  timeout: 15m
  releaseName: open-webui
  chart:
    spec:
      chart: open-webui
      version: 17.1.0
      sourceRef:
        kind: HelmRepository
        name: open-webui
  values:
    extraEnvVars:
      # OWUI's aiohttp upstream client defaults to a 300s "total" timeout
      # (AIOHTTP_CLIENT_TIMEOUT, env.py), which aborts any LLM generation
      # running longer than 5 minutes (e.g. large-context prompts). The
      # failure surfaces to the OpenCode client as an ECONNRESET /
      # "Connection lost while reading the response" mid-stream.
      # Raise so generations longer than 5 minutes can complete end-to-end.
      # The stream idle timeout (AIOHTTP_CLIENT_STREAM_IDLE_TIMEOUT) is
      # already None by default, so no idle-limiting change is needed.
      - name: AIOHTTP_CLIENT_TIMEOUT
        value: "3600"
    ollama:
      enabled: false
    pipelines:
      enabled: false
    persistence:
      enabled: true
      existingClaim: open-webui-data-pvc
    resources:
      requests:
        cpu: "200m"
        memory: "512Mi"
      limits:
        cpu: "1"
        memory: "1Gi"
    service:
      type: ClusterIP
  install:
    remediation:
      retries: 3
  # No rollback on failed upgrade: Open WebUI migrates its DB on startup and
  # can't run against a newer schema, so rolling back guarantees a crash loop.
  upgrade:
    remediation:
      retries: 0
