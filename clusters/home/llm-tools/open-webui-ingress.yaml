apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: open-webui-public
spec:
  hostnames:
  - open-webui.k8s.home.blrobinson.uk
  parentRefs:
  - name: gateway-ingress
    namespace: ingress
    sectionName: https
  rules:
  - backendRefs:
    - name: open-webui
      port: 80
    # Envoy defaults a route timeout to 15s, which RSTs any LLM stream
    # that runs longer (the "Connection lost: ECONNRESET" failures).
    # 3600s matches OWUI's AIOHTTP_CLIENT_TIMEOUT and gives long
    # generations room while still bounding genuinely stuck streams.
    timeouts:
      request: 3600s
