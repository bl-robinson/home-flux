apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: mailu
spec:
  interval: 5m0s
  url: https://mailu.github.io/helm-charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mailu
spec:
  interval: 10m
  timeout: 15m
  chart:
    spec:
      chart: mailu
      version: '2.8.0'
      sourceRef:
        kind: HelmRepository
        name: mailu
  values:
    hostnames:
      - mail.blrobinson.uk
      - webmail.blrobinson.uk
    domain: blrobinson.uk
    # existingSecret: mailu_sec
    # secret: ""
    initialAccount:
      enabled: true
      username: benr
      domain: blrobinson.uk
      existingSecret: "mailu-initial-account"
      existingSecretPasswordKey: "initial-account-password"
      mode: update
    subnet: 192.168.0.0/16
    externalRelay:
      host: "[smtp.mailersend.net]:587"
      existingSecret: relay-sec
      usernameKey: user
      passwordKey: password
    tls:
      outboundLevel: encrypt
    persistence:
      single_pvc: true
      size: 50Gi
      accessModes:
        - ReadWriteOnce
      existingClaim: "mail-pvc"
      storageClass: ""
    ingress:
      enabled: false
      existingSecret: mail-cert
      tlsFlavorOverride: mail
      # Real client IP for web/admin/SSO. Without REAL_IP_FROM, nginx ignores
      # REAL_IP_HEADER, so every login looks like it's from Cilium's Envoy (shared
      # auth rate-limit bucket per node). Trust only the Envoy / pod pools; Mailu
      # turns on real_ip_recursive, so it takes the rightmost untrusted entry.
      realIpHeader: X-Forwarded-For
      realIpFrom: "192.168.0.0/16,2a06:61c2:27ae::2:0/112"
    front:
      hostPort:
        enabled: false
      externalService:
        enabled: true
        type: LoadBalancer
        externalTrafficPolicy: Local
        loadBalancerIP: 10.0.3.104
    redis:
      master:
        persistence:
          enabled: false
    dovecot:
      persistence:
        claimNameOverride: ""
    rspamd:
      enabled: true
    postfix:
      logLevel: INFO
      updateStrategy:
        type: Recreate
    clamav:
      enabled: false
    webmail:
      enabled: true
      persistence:
        claimNameOverride: ""
  releaseName: mailu
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
