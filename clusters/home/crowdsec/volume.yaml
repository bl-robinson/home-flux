apiVersion: v1
kind: PersistentVolume
metadata:
  name: crowdsec-lapi-data-volume
  labels:
    volume: crowdsec-lapi-data-volume
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce
  nfs:
    server: 10.0.0.3
    path: "/data/crowdsec/data"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crowdsec-lapi-data-pvc
spec:
  resources:
    requests:
      storage: 1Gi
  volumeMode: Filesystem
  volumeName: crowdsec-lapi-data-volume
  accessModes:
    - ReadWriteOnce
  selector:
    matchLabels:
      volume: crowdsec-lapi-data-volume
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: crowdsec-lapi-config-volume
  labels:
    volume: crowdsec-lapi-config-volume
spec:
  capacity:
    storage: 100Mi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce
  nfs:
    server: 10.0.0.3
    path: "/data/crowdsec/config"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crowdsec-lapi-config-pvc
spec:
  resources:
    requests:
      storage: 100Mi
  volumeMode: Filesystem
  volumeName: crowdsec-lapi-config-volume
  accessModes:
    - ReadWriteOnce
  selector:
    matchLabels:
      volume: crowdsec-lapi-config-volume
